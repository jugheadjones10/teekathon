[project]
name = "gemini-paper-crop"
version = "0.1.0"
description = "Optional Gemini 3.5 Flash baseline for exam-paper cropping"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "google-genai==2.20.0",
    "pillow>=12.0.0",
    "pydantic>=2.12.0",
    "pymupdf>=1.26.0",
    "python-dotenv>=1.1.0",
]

[project.scripts]
crop-papers = "gemini_paper_crop.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "ruff>=0.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
