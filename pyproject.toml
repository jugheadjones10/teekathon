[project]
name = "teekathon-dataset"
version = "0.1.0"
description = "Dataset and starter tools for the Teekathon VLM cropping task"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = []

[project.scripts]
teekathon-data = "teekathon_dataset.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "ruff>=0.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
